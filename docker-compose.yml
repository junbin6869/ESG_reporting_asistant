name: esg-assistant

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TESSERACT_LANGUAGE_PACKAGES: "${TESSERACT_LANGUAGE_PACKAGES:-tesseract-ocr-eng}"
        PRELOAD_EMBEDDING_MODEL: "true"
        EMBEDDING_MODEL_ID: "${EMBEDDING_MODEL_ID:-sentence-transformers/all-MiniLM-L6-v2}"
    init: true
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      CLASSIFICATION_WORKER_COUNT: "${CLASSIFICATION_WORKER_COUNT:-3}"
      DATABASE_PATH: /app/data/esg_assistant.db
      LANGGRAPH_CHECKPOINT_PATH: /app/data/langgraph_checkpoints.db
      CHROMA_DB_DIR: /app/chroma_db
      GUIDELINE_PDF_DIR: /app/PDF
      AUTO_BUILD_VECTOR_DB: "${AUTO_BUILD_VECTOR_DB:-true}"
      EMBEDDING_MODEL: /opt/models/default-embedding
      EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-cpu}"
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      OCR_LANGUAGES: "${OCR_LANGUAGES:-eng}"
      CHROMA_COLLECTION: "${CHROMA_COLLECTION:-esg_docs}"
      RAG_SEARCH_TYPE: "${RAG_SEARCH_TYPE:-similarity}"
      RAG_SCORE_THRESHOLD: "${RAG_SCORE_THRESHOLD:-0.25}"
      RAG_MAX_TOP_K: "${RAG_MAX_TOP_K:-20}"
      RAG_MMR_FETCH_K: "${RAG_MMR_FETCH_K:-12}"
      RAG_MMR_LAMBDA: "${RAG_MMR_LAMBDA:-0.5}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - backend_data:/app/data
      - chroma_data:/app/chroma_db
      - backend_logs:/app/logs
      - type: bind
        source: ./PDF
        target: /app/PDF
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/dashboard').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

volumes:
  backend_data:
  chroma_data:
  backend_logs:

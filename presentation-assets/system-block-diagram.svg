<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">System Block Diagram of the ESG Invoice Classification and Reporting System</title>
  <desc id="desc">A top-down block diagram showing the user, Next.js frontend, FastAPI services, AI and RAG components, storage, and report package output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #64748b; }
      .layer { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
      .node-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .node-copy { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .arrow-label { font: 600 12px Arial, Helvetica, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <rect x="26" y="24" width="1548" height="992" rx="24" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="800" y="77" text-anchor="middle" class="title">System Block Diagram</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">ESG Invoice Classification and Reporting System</text>

  <!-- User -->
  <rect x="70" y="426" width="150" height="104" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="145" cy="456" r="18" fill="#2563eb"/>
  <circle cx="145" cy="452" r="6" fill="#ffffff"/>
  <path d="M133 470c3-9 21-9 24 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="145" y="497" text-anchor="middle" class="node-title">User</text>
  <text x="145" y="518" text-anchor="middle" class="node-copy">Uploads, reviews</text>

  <!-- Presentation -->
  <rect x="270" y="332" width="235" height="290" rx="18" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="295" y="366" class="layer" fill="#2563eb">PRESENTATION</text>
  <rect x="294" y="391" width="187" height="194" rx="14" fill="#ffffff" stroke="#dbeafe" filter="url(#shadow)"/>
  <rect x="315" y="414" width="40" height="40" rx="10" fill="#dbeafe"/>
  <path d="M326 426h18M326 434h12M326 442h16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="369" y="432" class="node-title">Next.js Web App</text>
  <text x="315" y="480" class="node-copy">• Dashboard and summaries</text>
  <text x="315" y="507" class="node-copy">• Invoice upload and review</text>
  <text x="315" y="534" class="node-copy">• Report preview and download</text>
  <text x="315" y="561" class="node-copy">• ZIP package download</text>

  <!-- Application layer -->
  <rect x="555" y="164" width="485" height="650" rx="18" fill="#fbfdff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="580" y="198" class="layer" fill="#2563eb">APPLICATION LAYER</text>
  <rect x="585" y="220" width="425" height="78" rx="14" fill="#e0f2fe" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="797" y="252" text-anchor="middle" class="node-title">FastAPI REST API</text>
  <text x="797" y="275" text-anchor="middle" class="node-copy">Invoice, classification, guideline and report endpoints</text>

  <rect x="585" y="330" width="198" height="294" rx="14" fill="#ffffff" stroke="#dbeafe" filter="url(#shadow)"/>
  <rect x="606" y="351" width="39" height="39" rx="10" fill="#dbeafe"/>
  <path d="M616 361h19v18h-19zM620 365h11" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="654" y="375" class="node-title">Invoice Module</text>
  <line x1="606" y1="410" x2="760" y2="410" stroke="#e2e8f0"/>
  <text x="606" y="440" class="node-copy">PDF text extraction</text>
  <text x="606" y="466" class="node-copy">OCR fallback</text>
  <text x="606" y="492" class="node-copy">Import and human review</text>
  <text x="606" y="534" class="node-title">Classification Worker</text>
  <text x="606" y="560" class="node-copy">Background job processing</text>
  <text x="606" y="586" class="node-copy">Structured ESG classification</text>

  <rect x="812" y="330" width="198" height="294" rx="14" fill="#ffffff" stroke="#dbeafe" filter="url(#shadow)"/>
  <rect x="833" y="351" width="39" height="39" rx="10" fill="#dbeafe"/>
  <path d="M842 362h20M842 370h15M842 378h20" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="881" y="375" class="node-title">Reporting Module</text>
  <line x1="833" y1="410" x2="987" y2="410" stroke="#e2e8f0"/>
  <text x="833" y="440" class="node-copy">Dashboard summary service</text>
  <text x="833" y="482" class="node-title">LangGraph Report Agent</text>
  <text x="833" y="508" class="node-copy">Evidence-led report workflow</text>
  <text x="833" y="550" class="node-title">Export Service</text>
  <text x="833" y="576" class="node-copy">PDF, CSV and ZIP package</text>

  <rect x="585" y="655" width="425" height="120" rx="14" fill="#f0fdfa" stroke="#99f6e4" filter="url(#shadow)"/>
  <text x="797" y="692" text-anchor="middle" class="node-title">System Orchestration</text>
  <text x="797" y="718" text-anchor="middle" class="node-copy">Background classification jobs · Report agent runs · Audit records</text>
  <text x="797" y="744" text-anchor="middle" class="node-copy">REST responses and download endpoints</text>

  <!-- AI and RAG -->
  <rect x="1080" y="164" width="445" height="408" rx="18" fill="#fcfaff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1105" y="198" class="layer" fill="#7c3aed">AI AND RAG LAYER</text>
  <rect x="1108" y="220" width="184" height="118" rx="14" fill="#ffffff" stroke="#ddd6fe" filter="url(#shadow)"/>
  <text x="1200" y="255" text-anchor="middle" class="node-title">Query Generation</text>
  <text x="1200" y="281" text-anchor="middle" class="node-copy">Invoice description +</text>
  <text x="1200" y="302" text-anchor="middle" class="node-copy">LLM-generated queries</text>

  <rect x="1318" y="220" width="180" height="118" rx="14" fill="#ffffff" stroke="#ddd6fe" filter="url(#shadow)"/>
  <text x="1408" y="255" text-anchor="middle" class="node-title">OpenAI LLM</text>
  <text x="1408" y="281" text-anchor="middle" class="node-copy">Classification and</text>
  <text x="1408" y="302" text-anchor="middle" class="node-copy">report generation</text>

  <rect x="1108" y="374" width="184" height="150" rx="14" fill="#ffffff" stroke="#ddd6fe" filter="url(#shadow)"/>
  <text x="1200" y="410" text-anchor="middle" class="node-title">Local Embeddings</text>
  <text x="1200" y="436" text-anchor="middle" class="node-copy">MiniLM model indexes</text>
  <text x="1200" y="457" text-anchor="middle" class="node-copy">guideline documents</text>

  <rect x="1318" y="374" width="180" height="150" rx="14" fill="#ffffff" stroke="#ddd6fe" filter="url(#shadow)"/>
  <text x="1408" y="410" text-anchor="middle" class="node-title">Chroma Vector DB</text>
  <text x="1408" y="436" text-anchor="middle" class="node-copy">ESG guideline chunks</text>
  <text x="1408" y="457" text-anchor="middle" class="node-copy">and evidence retrieval</text>

  <!-- Data layer -->
  <rect x="1080" y="620" width="445" height="260" rx="18" fill="#f7fffb" stroke="#99f6e4" stroke-width="2"/>
  <text x="1105" y="654" class="layer" fill="#0f766e">DATA AND KNOWLEDGE LAYER</text>
  <rect x="1108" y="680" width="184" height="158" rx="14" fill="#ffffff" stroke="#99f6e4" filter="url(#shadow)"/>
  <text x="1200" y="716" text-anchor="middle" class="node-title">SQLite Database</text>
  <text x="1200" y="746" text-anchor="middle" class="node-copy">Invoices and classifications</text>
  <text x="1200" y="770" text-anchor="middle" class="node-copy">Jobs, reports and versions</text>
  <text x="1200" y="794" text-anchor="middle" class="node-copy">Evidence-register snapshots</text>

  <rect x="1318" y="680" width="180" height="158" rx="14" fill="#ffffff" stroke="#99f6e4" filter="url(#shadow)"/>
  <text x="1408" y="716" text-anchor="middle" class="node-title">PDF Sources</text>
  <text x="1408" y="746" text-anchor="middle" class="node-copy">Invoice PDFs</text>
  <text x="1408" y="770" text-anchor="middle" class="node-copy">ESG guideline PDFs</text>
  <text x="1408" y="794" text-anchor="middle" class="node-copy">Knowledge source files</text>

  <!-- Outputs -->
  <rect x="555" y="856" width="485" height="122" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="580" y="889" class="layer" fill="#15803d">SYSTEM OUTPUT</text>
  <rect x="580" y="906" width="197" height="48" rx="11" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="679" y="936" text-anchor="middle" class="node-title">Classification &amp; Dashboard</text>
  <rect x="804" y="906" width="210" height="48" rx="11" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="909" y="927" text-anchor="middle" class="node-title">ZIP Report Package</text>
  <text x="909" y="946" text-anchor="middle" class="small">PDF Report + Evidence Register CSV</text>

  <!-- Connections -->
  <path d="M220 478H270" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M505 478H555V259H585" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="514" y="455" class="arrow-label">HTTPS</text>

  <path d="M700 298V330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M900 298V330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1010 259H1080" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1028" y="242" class="arrow-label">AI requests</text>
  <path d="M1040 715H1080" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1028" y="698" class="arrow-label">Read / write</text>
  <path d="M1300 620V572" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1313" y="600" class="arrow-label">Index / retrieve</text>
  <path d="M797 775V856" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="56" y="1003" class="small">Figure 4.1. Top-down architecture of the ESG Invoice Classification and Reporting System.</text>
</svg>
